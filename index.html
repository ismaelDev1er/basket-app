<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basket Connect</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basket">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#15171c;--s1:#1e2128;--s2:#272b34;--tx:#eef0f5;--mu:#9aa1b2;--or:#ff7a1a;--am:#ffb347;--bd:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(90px);opacity:.2;animation:dr 24s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--or);top:-14vmax;left:-10vmax}.bg i:nth-child(2){background:#6d4aff;bottom:-16vmax;right:-10vmax;animation-delay:-8s}
@keyframes dr{to{transform:translate(7vmax,5vmax) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
:focus-visible{outline:2px solid var(--am);outline-offset:3px;border-radius:8px}
.wrap{max-width:1100px;margin:auto;padding:0 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.ball{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--am),var(--or));animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-4px)}}
nav{display:flex;gap:4px;background:var(--s1);border:1px solid var(--bd);border-radius:999px;padding:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mu);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.25s}
nav button[aria-selected=true]{background:var(--s2);color:var(--tx)}
.view{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.hero{padding:clamp(40px,9vw,90px) 0 24px;max-width:640px}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.08;letter-spacing:-.03em;margin:0 0 14px}
.hero h1 span{background:linear-gradient(90deg,var(--or),var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);margin:0 0 24px;font-size:1.08rem}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;color:#1a1204;padding:12px 22px;border-radius:12px;background:linear-gradient(135deg,var(--or),var(--am));transition:transform .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px -8px rgba(255,122,26,.6)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--s2);color:var(--tx)}.btn.g:hover{box-shadow:none}.btn:disabled{opacity:.5;pointer-events:none}
.panel{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:22px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--or);outline:0;box-shadow:0 0 0 3px rgba(255,122,26,.2)}
label{display:grid;gap:6px;font-size:.85rem;color:var(--mu)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:20px;animation:up .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:scale(1.03);border-color:rgba(255,122,26,.5);box-shadow:0 12px 30px -14px rgba(255,122,26,.5)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--or),var(--am));color:#1a1204;margin-bottom:10px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.card h3{margin:0;font-size:1.05rem}.card small{color:var(--mu)}.card p{color:var(--mu);margin:8px 0 0;font-size:.92rem}
.pill{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:var(--s2);color:var(--am);margin-right:6px}
.chat{display:flex;flex-direction:column;height:max(460px,calc(100vh - 190px));height:max(460px,calc(100dvh - 190px));margin-top:8px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.mw{display:flex;flex-direction:column;align-items:flex-start;max-width:85%}
.mw.new{animation:up .3s both}.mw.me{align-self:flex-end;align-items:flex-end}
.m{background:var(--s2);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:1.02rem;overflow-wrap:anywhere;max-width:100%}
.m.me{background:rgba(255,122,26,.18);border-radius:14px 14px 4px 14px}
.m b{font-size:.78rem;color:var(--am);display:block}.m span{font-size:.7rem;color:var(--mu)}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rb{border:1px solid var(--bd);background:var(--s1);color:var(--mu);border-radius:999px;padding:2px 10px;font:inherit;font-size:.85rem;cursor:pointer;opacity:.55;transition:opacity .2s,transform .2s,background .2s}
.rb:hover,.rb.has{opacity:1}.rb:hover{transform:scale(1.12)}.rb.on{opacity:1;background:rgba(255,122,26,.22);border-color:var(--or);color:var(--tx)}
.bdg{background:var(--or);color:#1a1204;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 7px;margin-left:4px}
.send{display:flex;gap:8px;margin-top:12px}
.note{font-size:.85rem;color:var(--mu);background:var(--s2);border-radius:12px;padding:12px 14px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:10px 18px;border-radius:999px;animation:up .3s both;z-index:9}
@media (max-width:640px){
 body{padding-bottom:84px}
 .top{padding:14px 0 6px}
 .top nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;flex-wrap:nowrap;background:rgba(30,33,40,.94);backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
 .top nav button{padding:10px 8px;font-size:.82rem;white-space:nowrap}
 .chat{height:max(380px,calc(100dvh - 250px))}
 .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
#inst{position:fixed;right:14px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<div class="wrap">
 <div class="top"><div class="logo"><span class="ball"></span>Basket Connect</div>
 <nav role="tablist" aria-label="Sections" id="nv"></nav></div>
 <main id="v" class="view" tabindex="-1"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>')</script>
<script>
(function(){
"use strict";
/* ====== À REMPLIR (Supabase > Project Settings > API) ====== */
var SUPABASE_URL="https://jaeyzrwaehxlgqzwgbxw.supabase.co";
var SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphZXl6cndhZWh4bGdxendnYnh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzgwMzAsImV4cCI6MjEwNzQxNDAzMH0.qOXgX7FH5nEF1U-a2-P9bPbYabnnTMhH7OjdZpxlUWI";
/* La clé "anon" est publique par conception : la sécurité vient des règles RLS de setup.sql. */

var $=function(s,e){return (e||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var POS=["Meneur","Arrière","Ailier","Ailier fort","Pivot"],LVL=["Loisir","Club","Régional","National"];
var S={view:"home",user:null,players:[],msgs:[],mode:"in",ch:null,reacts:{},unread:0,maxId:0,boot:false,drawn:null,sig:null};
var RX=[["like","👍","J’aime"],["heart","❤️","Cœur"],["smile","😊","Sourire"]];
var main=$("#v"),sb=null;
var configured=SUPABASE_URL.indexOf("REMPLACEZ")<0&&window.supabase;
if(configured)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function toast(t){var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3000)}
function ini(n){return esc((n||"?").trim().charAt(0).toUpperCase())}
function avh(p){var a=p&&p.photo;return /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(a||"")?'<img alt="" src="'+a+'">':ini(p&&p.pseudo)}
function shrink(file){return new Promise(function(ok,ko){var r=new FileReader();r.onerror=ko;r.onload=function(){var i=new Image();i.onerror=ko;i.onload=function(){var s=160,c=document.createElement("canvas");c.width=c.height=s;var m=Math.min(i.width,i.height),g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,s,s);g.drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,s,s);ok(c.toDataURL("image/jpeg",.8))};i.src=r.result};r.readAsDataURL(file)})}
function mine(){return S.players.filter(function(p){return S.user&&p.id===S.user.id})[0]}

function nav(){
 var t=[["home","Accueil"]].concat(S.user?[["players","Joueurs"],["chat","Messages"],["me","Mon profil"]]:[["auth","Connexion"]]);
 $("#nv").innerHTML=t.map(function(x){var g=x[0]==="chat"&&S.unread?'<span class="bdg">'+(S.unread>9?"9+":S.unread)+'</span>':"";return '<button role="tab" data-v="'+x[0]+'" aria-selected="'+(S.view===x[0])+'">'+x[1]+g+'</button>'}).join("")
 +(S.user&&"Notification" in window&&Notification.permission==="default"?'<button data-v="bell" title="Activer les notifications" aria-label="Activer les notifications">🔔</button>':"")
 +(S.user?'<button data-v="out">Déconnexion</button>':"");
 document.title=(S.unread?"("+S.unread+") ":"")+"Basket Connect"
}
$("#nv").onclick=function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.v==="out"){sb.auth.signOut();return}
 if(b.dataset.v==="bell"){Notification.requestPermission().then(function(p){toast(p==="granted"?"Notifications activées":"Notifications non autorisées");nav()});return}
 setView(b.dataset.v)};
function setView(v){S.view=v;if(v==="chat")S.unread=0;main.classList.remove("view");void main.offsetWidth;main.classList.add("view");nav();draw()}
function draw(){
 nav();
 if(!configured){var why=SUPABASE_URL.indexOf("REMPLACEZ")>-1?"Ce fichier n’est pas la version configurée : l’adresse du projet est absente. Retéléchargez le dernier index.html.":"La bibliothèque Supabase n’a pas pu se charger. Vérifiez votre connexion Internet et désactivez temporairement tout bloqueur (antivirus, bloqueur de publicités, réseau d’entreprise ou d’école).";main.innerHTML='<div class="panel" style="margin-top:24px"><b>Le site ne peut pas démarrer.</b><p style="color:var(--mu)">'+why+'</p></div>';return}
 var v=S.view;
 if(v!=="home"&&!S.user)v="auth";
 if(v==="home")home();else if(v==="auth")auth();else if(v==="players")players();else if(v==="chat")chat();else profile()
}
function home(){
 main.innerHTML='<section class="hero"><h1>Une seule plateforme pour <span>tous les basketteurs.</span></h1><p>Créez votre profil de joueur, retrouvez les autres joueurs et échangez dans la discussion commune.</p><button class="btn" id="go">'+(S.user?(mine()?"Voir les joueurs":"Compléter mon profil"):"Je m’inscris")+'</button></section>';
 $("#go").onclick=function(){if(!S.user){S.mode="up";setView("auth")}else setView(mine()?"players":"me")}
}
function auth(){
 var up=S.mode==="up";
 main.innerHTML='<h2 style="margin:24px 0 12px">'+(up?"Inscription":"Connexion")+'</h2><form class="panel form" id="af" style="max-width:460px">'+
 '<label class="full">Email<input id="em" type="email" required autocomplete="email"></label>'+
 '<label class="full">Mot de passe (8 caractères minimum)<input id="pw" type="password" required minlength="8" autocomplete="'+(up?"new-password":"current-password")+'"></label>'+
 '<div class="full row"><button class="btn" type="submit">'+(up?"Créer mon compte":"Me connecter")+'</button><button type="button" class="btn g" id="sw">'+(up?"J’ai déjà un compte":"Créer un compte")+'</button></div></form>';
 $("#sw").onclick=function(){S.mode=up?"in":"up";auth()};
 $("#af").onsubmit=async function(e){e.preventDefault();var b=e.submitter;b.disabled=true;var c={email:$("#em").value.trim(),password:$("#pw").value};
  var r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);b.disabled=false;
  if(r.error){toast(up?"Inscription impossible : "+r.error.message:"Email ou mot de passe incorrect");return}
  if(up&&!r.data.session)toast("Compte créé : confirmez votre email puis connectez-vous")}
}
function players(){
 var list=S.players.slice().sort(function(a,b){return (a.pseudo||"").localeCompare(b.pseudo||"","fr")});
 main.innerHTML='<h2 style="margin:24px 0 4px">Joueurs</h2><div class="row"><input id="q" type="search" aria-label="Rechercher" placeholder="Rechercher par nom, poste ou ville…" style="max-width:420px"><select id="pf" aria-label="Poste" style="max-width:180px"><option value="">Tous les postes</option>'+POS.map(function(p){return '<option>'+p+'</option>'}).join("")+'</select></div><div class="grid" id="g"></div>';
 function d(){var q=$("#q").value.toLowerCase(),pf=$("#pf").value;
  var r=list.filter(function(p){return (!pf||p.poste===pf)&&(!q||((p.pseudo||"")+" "+(p.poste||"")+" "+(p.ville||"")).toLowerCase().indexOf(q)>-1)});
  $("#g").innerHTML=r.length?r.map(function(p,i){return '<article class="card" style="animation-delay:'+(i%8)*50+'ms"><div class="av">'+avh(p)+'</div><h3>'+esc(p.pseudo)+'</h3><small>'+esc(p.ville||"")+'</small><div style="margin-top:8px"><span class="pill">'+esc(p.poste||"")+'</span>'+(p.taille?'<span class="pill">'+esc(p.taille)+' cm</span>':"")+'<span class="pill">'+esc(p.niveau||"")+'</span></div>'+(p.bio?'<p>'+esc(p.bio)+'</p>':"")+'</article>'}).join(""):'<div class="panel" style="grid-column:1/-1;color:var(--mu)">Aucun joueur pour le moment.</div>'}
 $("#q").oninput=d;$("#pf").onchange=d;d()
}
function profile(){
 var p=mine()||{};
 main.innerHTML='<h2 style="margin:24px 0 12px">'+(p.pseudo?"Mon profil":"Inscription")+'</h2><form class="panel form" id="f">'+
 '<div class="full row"><div class="av" id="pv" style="width:76px;height:76px;margin:0;font-size:1.6rem"></div><label style="flex:1;min-width:180px">Photo de profil<input id="ph" type="file" accept="image/*"></label>'+(p.photo?'<button type="button" class="btn g" id="rp">Retirer la photo</button>':"")+'</div>'+
 '<label>Pseudo<input id="ps" required maxlength="30" value="'+esc(p.pseudo||"")+'"></label>'+
 '<label>Poste<select id="po">'+POS.map(function(x){return '<option'+(p.poste===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></label>'+
 '<label>Taille (cm)<input id="ta" type="number" min="100" max="240" value="'+esc(p.taille||"")+'"></label>'+
 '<label>Niveau<select id="ni">'+LVL.map(function(x){return '<option'+(p.niveau===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></label>'+
 '<label class="full">Ville<input id="vi" maxlength="60" value="'+esc(p.ville||"")+'"></label>'+
 '<label class="full">Présentation<textarea id="bi" rows="3" maxlength="240">'+esc(p.bio||"")+'</textarea></label>'+
 '<label class="full" style="display:flex;align-items:center;gap:10px"><input id="vs" type="checkbox" style="width:auto"'+(p.visible===false?"":" checked")+'>Afficher mon profil aux autres joueurs</label>'+
 '<div class="full row"><button class="btn" type="submit">Enregistrer</button>'+(p.pseudo?'<button type="button" class="btn g" id="dl">Supprimer mon profil</button>':"")+'</div></form>'+
 '<p class="note">Ne publiez ni téléphone, ni adresse. Les joueurs mineurs doivent s’inscrire avec l’accord d’un responsable.</p>';
 var photo=p.photo||null;function pv(){$("#pv").innerHTML=avh({pseudo:$("#ps").value,photo:photo})}pv();$("#ps").oninput=pv;
 $("#ph").onchange=function(e){var f=e.target.files[0];if(!f)return;shrink(f).then(function(d){photo=d;pv()}).catch(function(){toast("Image illisible")})};
 var rp=$("#rp");if(rp)rp.onclick=function(){photo=null;pv();rp.remove()};
 $("#f").onsubmit=async function(e){e.preventDefault();var b=e.submitter;b.disabled=true;
  var r=await sb.from("profiles").upsert({id:S.user.id,pseudo:$("#ps").value.trim().slice(0,30),poste:$("#po").value,taille:+$("#ta").value||null,niveau:$("#ni").value,ville:$("#vi").value.trim().slice(0,60),bio:$("#bi").value.trim().slice(0,240),visible:$("#vs").checked,photo:photo});
  if(r.error){toast("Enregistrement impossible");b.disabled=false;return}
  await loadPlayers();toast("Profil enregistré");setView("players")};
 var dl=$("#dl");if(dl)dl.onclick=async function(){if(!confirm("Supprimer votre profil et vos messages ?"))return;var r=await sb.from("profiles").delete().eq("id",S.user.id);if(r.error){toast("Suppression impossible");return}await loadPlayers();await loadMsgs();setView("me")}
}
function chat(){
 main.innerHTML='<div class="panel chat"><div class="msgs" id="ms" role="log" aria-live="polite"></div><form class="send" id="sf"><input id="tx" maxlength="500" placeholder="Votre message…" aria-label="Message" autocomplete="off"><button class="btn" type="submit">Envoyer</button></form></div><p class="note">Discussion commune à tous les joueurs inscrits. Restez respectueux.</p>';
 var last=0;S.sig=null;S.drawn=null;
 $("#sf").onsubmit=async function(e){e.preventDefault();var t=$("#tx").value.trim();if(!t||Date.now()-last<800)return;
  if(!mine()){toast("Créez d’abord votre profil");setView("me");return}
  last=Date.now();$("#tx").value="";var r=await sb.from("messages").insert({text:t.slice(0,500)});if(r.error){toast("Message non envoyé : "+r.error.message);$("#tx").value=t}else pollNew()};
 $("#ms").onclick=function(e){var b=e.target.closest(".rb");if(b)react(+b.dataset.id,b.dataset.k)};
 drawMsgs();loadReacts()
}
function rxHTML(m){var r=S.reacts[m.id]||{},cnt={},mk=S.user&&r[S.user.id];Object.keys(r).forEach(function(u){cnt[r[u]]=(cnt[r[u]]||0)+1});
 return '<div class="rx">'+RX.map(function(x){var c=cnt[x[0]]||0;return '<button type="button" class="rb'+(mk===x[0]?" on":"")+(c?" has":"")+'" data-id="'+m.id+'" data-k="'+x[0]+'" aria-pressed="'+(mk===x[0])+'" aria-label="'+x[2]+(c?" ("+c+")":"")+'">'+x[1]+(c?" "+c:"")+'</button>'}).join("")+'</div>'}
function drawMsgs(){var box=$("#ms");if(!box)return;
 var lastId=S.msgs.length?S.msgs[S.msgs.length-1].id:0,sig=S.msgs.length+":"+lastId+":"+JSON.stringify(S.reacts);
 if(sig===S.sig&&box.dataset.s)return;S.sig=sig;
 var low=box.scrollHeight-box.scrollTop-box.clientHeight<80,seen=S.drawn==null?lastId:S.drawn;
 box.innerHTML=S.msgs.length?S.msgs.map(function(m){var me=S.user&&m.user_id===S.user.id,n=(m.profiles&&m.profiles.pseudo)||"Joueur";
  return '<div class="mw'+(me?" me":"")+(m.id>seen?" new":"")+'"><div class="m'+(me?" me":"")+'">'+(me?"":'<b>'+esc(n)+'</b>')+esc(m.text)+' <span>'+new Date(m.created_at).toLocaleTimeString("fr",{hour:"2-digit",minute:"2-digit"})+'</span></div>'+rxHTML(m)+'</div>'}).join(""):'<p style="color:var(--mu)">Aucun message. Lancez la discussion !</p>';
 S.drawn=lastId;
 if(low||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}}
async function react(id,k){
 if(!mine()){toast("Créez d’abord votre profil");return}
 var o=S.reacts[id]=S.reacts[id]||{},cur=o[S.user.id],r;
 if(cur===k){delete o[S.user.id];drawMsgs();r=await sb.from("message_reactions").delete().eq("message_id",id).eq("user_id",S.user.id)}
 else{o[S.user.id]=k;drawMsgs();r=await sb.from("message_reactions").upsert({message_id:id,user_id:S.user.id,kind:k})}
 if(r.error){toast("Réaction impossible");loadReacts()}}
async function loadReacts(){
 if(!S.user||!S.msgs.length)return;
 var r=await sb.from("message_reactions").select("message_id,user_id,kind").gte("message_id",S.msgs[0].id);
 if(r.error)return;var o={};(r.data||[]).forEach(function(x){(o[x.message_id]=o[x.message_id]||{})[x.user_id]=x.kind});S.reacts=o;drawMsgs()}
function notify(m){
 if(S.view==="chat"&&!document.hidden)return;
 var n=(m.profiles&&m.profiles.pseudo)||"Un joueur",txt=n+" a envoyé un message";
 S.unread++;nav();
 if(!document.hidden)toast(txt+" : "+m.text.slice(0,60));
 else if("Notification" in window&&Notification.permission==="granted"){try{var x=new Notification(txt,{body:m.text.slice(0,100),tag:"msg"});x.onclick=function(){window.focus();setView("chat");x.close()}}catch(e){}}
}

async function loadPlayers(){var r=await sb.from("profiles").select("*");S.players=r.data||[];if(S.view==="players"||S.view==="home")draw()}
async function loadMsgs(){var r=await sb.from("messages").select("id,user_id,text,created_at,profiles!messages_user_id_fkey(pseudo)").order("id",{ascending:false}).limit(100);if(r.error){toast("Chargement des messages impossible : "+r.error.message);return}S.msgs=(r.data||[]).reverse();S.maxId=S.msgs.length?S.msgs[S.msgs.length-1].id:0;S.boot=true;drawMsgs();loadReacts()}
async function pollNew(){
 if(!S.user||!S.boot||S.busy)return;S.busy=true;
 try{var r=await sb.from("messages").select("id,user_id,text,created_at,profiles!messages_user_id_fkey(pseudo)").gt("id",S.maxId).order("id",{ascending:true}).limit(50);
  if(r.error||!r.data||!r.data.length)return;
  r.data.forEach(function(m){S.msgs.push(m);S.maxId=Math.max(S.maxId,m.id);if(m.user_id!==S.user.id)notify(m)});
  if(S.msgs.length>200)S.msgs=S.msgs.slice(-200);
  drawMsgs();loadReacts()}
 finally{S.busy=false}}
function subscribe(){
 sb.removeAllChannels();
 S.ch=sb.channel("live").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},pollNew).on("postgres_changes",{event:"*",schema:"public",table:"message_reactions"},loadReacts).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},loadPlayers).subscribe()
}
async function onUser(u){
 S.user=u;
 if(u){await loadPlayers();await loadMsgs();subscribe();
  if(!S.poll){S.poll=setInterval(function(){pollNew();if(S.user&&S.view==="chat"&&!document.hidden)loadReacts()},5000);
   document.addEventListener("visibilitychange",function(){if(S.user&&!document.hidden){if(S.view==="chat"){S.unread=0;nav()}pollNew();loadPlayers()}})}
  if(S.view==="auth")S.view=mine()?"players":"me"}
 else{sb.removeAllChannels();S.players=[];S.msgs=[];S.reacts={};S.unread=0;S.maxId=0;S.boot=false;S.view="home"}
 draw()
}
draw();
if(configured){
 sb.auth.onAuthStateChange(function(_e,s){var u=s?s.user:null;
  if((u&&S.user&&u.id===S.user.id)||(!u&&!S.user&&S.ready)){S.user=u;return}
  S.ready=true;setTimeout(function(){onUser(u)},0)});
}
})();
</script>
<script>
(function(){
 if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
 var standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone;
 if(standalone)return;
 function bar(txt,fn){var b=document.createElement("button");b.id="inst";b.className="btn";b.textContent=txt;b.onclick=function(){fn(b)};document.body.appendChild(b)}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();bar("Installer l’application",function(b){e.prompt();e.userChoice.then(function(){b.remove()})})});
 window.addEventListener("appinstalled",function(){var b=document.getElementById("inst");if(b)b.remove()});
 if(/iphone|ipad|ipod/i.test(navigator.userAgent)){var k=0;try{k=localStorage.getItem("ios-hint")}catch(e){}
  if(!k)bar("Installer : Partager ▸ Sur l’écran d’accueil",function(b){try{localStorage.setItem("ios-hint","1")}catch(e){}b.remove()})}
})();
</script>
